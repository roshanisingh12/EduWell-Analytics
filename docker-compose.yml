services:
  eduwell-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduwell-analytics
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_MB=25
      - COOKIE_SECURE=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
